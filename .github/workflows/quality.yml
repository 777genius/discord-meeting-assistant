name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: apps/pipecat-runtime/uv.lock
          enable-cache: true
          python-version: "3.13"
          version: 0.11.12
          working-directory: apps/pipecat-runtime
      - run: pnpm install --frozen-lockfile
      - run: uv sync --directory apps/pipecat-runtime --frozen --all-groups
      - run: pnpm run coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: true
          files: "./apps/pipecat-runtime/coverage.xml,./apps/meeting-platform/coverage/lcov.info,./apps/subscription-runtime-sidecar/coverage/lcov.info,./packages/*/coverage/lcov.info,./infra/subscription-runtime/coverage/lcov.info"
          use_oidc: true

  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: node vendor/infinity-context/prepare-official-sdk.mjs
      - run: pnpm install --frozen-lockfile
      - name: Build workspace package boundaries
        run: pnpm --recursive --if-present run build
      - name: Run fast static and architecture checks
        run: pnpm run check:fast
      - name: Run package unit and contract checks
        run: >-
          pnpm --recursive
          --filter './packages/**'
          --filter '!@discord-meeting/infinity-context-adapter'
          --filter '!@discord-meeting/postgres-adapter'
          --if-present run check

  infinity-integration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        name: Detect Infinity boundary changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            .github/workflows/quality.yml \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            vendor/infinity-context \
            packages/infinity-context-adapter \
            packages/meeting-core \
            packages/postgres-adapter \
            packages/subscription-runtime-adapter; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.required == 'true'
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.18.0
      - if: steps.changes.outputs.required == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.changes.outputs.required == 'true'
        run: node vendor/infinity-context/prepare-official-sdk.mjs
      - if: steps.changes.outputs.required == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.required == 'true'
        name: Build Infinity dependency closure
        run: >-
          pnpm --filter @discord-meeting/infinity-context-adapter...
          --if-present run build
      - if: steps.changes.outputs.required == 'true'
        name: Run full Infinity adapter checks
        run: pnpm --filter @discord-meeting/infinity-context-adapter run check

  postgres-integration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        name: Detect PostgreSQL boundary changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            .github/workflows/quality.yml \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            packages/meeting-core \
            packages/meeting-routing-core \
            packages/postgres-adapter; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.required == 'true'
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.18.0
      - if: steps.changes.outputs.required == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.changes.outputs.required == 'true'
        run: node vendor/infinity-context/prepare-official-sdk.mjs
      - if: steps.changes.outputs.required == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.required == 'true'
        name: Build PostgreSQL dependency closure
        run: >-
          pnpm --filter @discord-meeting/postgres-adapter...
          --if-present run build
      - if: steps.changes.outputs.required == 'true'
        name: Run full PostgreSQL adapter checks
        run: pnpm --filter @discord-meeting/postgres-adapter run check

  full-check:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: apps/pipecat-runtime/uv.lock
          enable-cache: true
          python-version: "3.13"
          version: 0.11.12
          working-directory: apps/pipecat-runtime
      - run: node vendor/infinity-context/prepare-official-sdk.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
