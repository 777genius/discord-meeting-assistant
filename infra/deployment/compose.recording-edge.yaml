services:
  recording-edge:
    build:
      context: .
      dockerfile: recording-edge.Dockerfile
    image: discord-meeting/recording-edge:2.11.4-1
    init: true
    restart: unless-stopped
    read_only: true
    command:
      ["run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./recording-edge.Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /config:rw,noexec,nosuid,nodev,size=8m,mode=0700,uid=10001,gid=10001
      - /data:rw,noexec,nosuid,nodev,size=8m,mode=0700,uid=10001,gid=10001
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=0700,uid=10001,gid=10001
    cap_drop: [ALL]
    networks: [meeting-internal, public-edge]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m

networks:
  meeting-internal:
    external: true
    name: ${MEETING_INTERNAL_NETWORK:?set the exact project-scoped meeting-internal network name}
  public-edge:
    external: true
    name: ${PUBLIC_EDGE_NETWORK:?set the network used by the host HTTPS proxy}
