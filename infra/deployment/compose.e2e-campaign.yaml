name: discord-meeting-assistant

# Test-only overlay. E2E_CAMPAIGN_HOST_ROOT must be a fresh private directory
# containing exactly one campaign namespace. Never add this mount to compose.yaml.
services:
  meeting-platform:
    labels:
      e2e.test-only: "true"
      e2e.shared-campaign-root: "acknowledged"
    environment:
      DISCORD_E2E_CAMPAIGN_SHARED_ROOT_ACKNOWLEDGED: "true"
      E2E_TEST_ONLY_LABEL: "true"
      CONVERSATION_E2E_PLAYBACK_READINESS_ROOT: /run/e2e-campaign/${E2E_CAMPAIGN_ID:?set fresh campaign ID}/run-3/answer-handshakes
      CONVERSATION_E2E_PLAYBACK_READINESS_RUN_ID: ${E2E_RECONNECT_RUN_ID:?set reconnect run ID}
      CONVERSATION_E2E_PLAYBACK_READINESS_TIMEOUT_MS: ${E2E_PLAYBACK_READINESS_TIMEOUT_MS:-120000}
      CONVERSATION_E2E_GREETING_OBSERVER_PARTICIPANT_ID: ${E2E_OBSERVER_APPLICATION_ID:?set official observer application ID}
      CONVERSATION_E2E_GREETING_PLAYBACK_READINESS_ROOT: /run/e2e-campaign/${E2E_CAMPAIGN_ID:?set fresh campaign ID}/run-3/greeting-handshakes
    volumes:
      - ${E2E_CAMPAIGN_HOST_ROOT:?set fresh private per-campaign host root}:/run/e2e-campaign

  discord-e2e-campaign-runner:
    profiles: [e2e-campaign]
    build:
      context: ../..
      dockerfile: apps/discord-e2e-actors/Dockerfile
    image: discord-meeting/discord-e2e-actors:${E2E_RUNNER_SOURCE_REVISION:?set immutable source revision}
    init: true
    restart: "no"
    read_only: true
    labels:
      e2e.test-only: "true"
      e2e.shared-campaign-root: "acknowledged"
    entrypoint: ["node", "dist/run-hosted-campaign.js"]
    command:
      - /run/e2e-campaign/${E2E_CAMPAIGN_ID:?set fresh campaign ID}/control/plan.json
      - /run/e2e-campaign/${E2E_CAMPAIGN_ID:?set fresh campaign ID}/campaign-pass.json
      - ${E2E_CAMPAIGN_TIMEOUT_MS:-14400000}
      - /run/e2e-campaign/${E2E_CAMPAIGN_ID:?set fresh campaign ID}/control/admission.json
      - /run/e2e-campaign/${E2E_CAMPAIGN_ID:?set fresh campaign ID}/control/definition.json
      - /run/e2e-campaign/${E2E_CAMPAIGN_ID:?set fresh campaign ID}/control/bindings.json
    environment:
      DISCORD_E2E_CAMPAIGN_SHARED_ROOT_ACKNOWLEDGED: "true"
    volumes:
      - ${E2E_CAMPAIGN_HOST_ROOT:?set fresh private per-campaign host root}:/run/e2e-campaign
      - ${E2E_RUNNER_SECRET_DIRECTORY:?set runner-only test token directory}:/run/e2e-runner-secrets:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=0700,uid=10001,gid=10001
    cap_drop: [ALL]
    networks: [meeting-internal, meeting-egress]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    stop_grace_period: 30s
