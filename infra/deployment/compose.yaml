name: discord-meeting-assistant

services:
  postgres:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    init: true
    restart: unless-stopped
    environment:
      POSTGRES_DB: meeting
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_USER: meeting
    volumes:
      - ${DEPLOY_ROOT:?set DEPLOY_ROOT}/data/postgres:/var/lib/postgresql
      - ${DEPLOY_ROOT:?set DEPLOY_ROOT}/secrets/postgres-password:/run/secrets/postgres-password:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting -d meeting"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks: [meeting-internal]
    security_opt: [no-new-privileges:true]

  postgres-migrations:
    build:
      args:
        SOURCE_REVISION: ${MEETING_PLATFORM_SOURCE_REVISION:?set immutable source revision}
      context: ../..
      dockerfile: apps/meeting-platform/Dockerfile
    image: discord-meeting/meeting-platform:${MEETING_PLATFORM_SOURCE_REVISION:?set immutable source revision}
    init: true
    restart: "no"
    read_only: true
    entrypoint:
      ["/app/apps/meeting-platform/node_modules/.bin/tsx", "/app/packages/postgres-adapter/src/run-migrations.ts"]
    environment:
      NODE_ENV: production
      POSTGRES_URL_FILE: /run/secrets/postgres-url
    volumes:
      - ${DEPLOY_ROOT:?set DEPLOY_ROOT}/secrets/platform:/run/secrets:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=0700,uid=10001,gid=10001
    depends_on:
      postgres: { condition: service_healthy }
    networks: [meeting-internal]
    security_opt: [no-new-privileges:true]

  redis:
    image: redis:8.8.1-alpine@sha256:8096655e437712b07503796fb64d81359256cfcff0ab29d95a7da72863786efb
    init: true
    restart: unless-stopped
    environment:
      SKIP_FIX_PERMS: "1"
    command: ["redis-server", "/run/secrets/redis.conf"]
    volumes:
      - ${DEPLOY_ROOT:?set DEPLOY_ROOT}/data/redis:/data
      - ${DEPLOY_ROOT:?set DEPLOY_ROOT}/secrets/redis.conf:/run/secrets/redis.conf:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "export REDISCLI_AUTH=$$(sed -n 's/^requirepass //p' /run/secrets/redis.conf); redis-cli ping",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [meeting-internal]
    security_opt: [no-new-privileges:true]

  object-storage:
    image: chrislusf/seaweedfs:4.29@sha256:d47c7ee99fcb951351d7194915f4e3a5ea604a8e8871183d713907dec4fb9bf5
    init: true
    restart: unless-stopped
    command:
      - server
      - -dir=/data
      - -ip=object-storage
      - -s3
      - -s3.port=8333
      - -s3.config=/run/secrets/s3-config.json
    volumes:
      - ${DEPLOY_ROOT:?set DEPLOY_ROOT}/data/object-storage:/data
      - ${DEPLOY_ROOT:?set DEPLOY_ROOT}/secrets/s3-config.json:/run/secrets/s3-config.json:ro
    networks: [meeting-internal]
    security_opt: [no-new-privileges:true]

  speaches:
    profiles: [local-stt]
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu@sha256:2163775b6df5e451a71200e8f675fed68dbd8ab184fc604453d549e486f22fd2
    init: true
    restart: unless-stopped
    environment:
      ENABLE_UI: "false"
      LOG_LEVEL: info
      PRELOAD_MODELS: '["${SPEACHES_MODEL_ID:-Systran/faster-whisper-small}"]'
      STT_MODEL_TTL: "-1"
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__CPU_THREADS: "4"
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__NUM_WORKERS: "1"
    volumes:
      - ${DEPLOY_ROOT:?set DEPLOY_ROOT}/data/huggingface:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    networks: [meeting-internal, meeting-egress]
    security_opt: [no-new-privileges:true]
    cpus: ${SPEACHES_CPUS:-4.0}
    mem_limit: ${SPEACHES_MEMORY_LIMIT:-7g}

  subscription-runtime-sidecar:
    build:
      args:
        SOURCE_REVISION: ${SUBSCRIPTION_RUNTIME_SOURCE_REVISION:?set immutable source revision}
      context: ../..
      dockerfile: apps/subscription-runtime-sidecar/Dockerfile
    image: discord-meeting/subscription-runtime-sidecar:${SUBSCRIPTION_RUNTIME_SOURCE_REVISION:?set immutable source revision}
    init: true
    restart: unless-stopped
    read_only: true
    environment:
      SUBSCRIPTION_RUNTIME_AUTH_POOL_MANIFEST_PATH: /run/subscription-runtime-auth/pool.json
      SUBSCRIPTION_RUNTIME_DISABLE_TOOLS: "1"
      SUBSCRIPTION_RUNTIME_EXECUTION_PROFILE: stateless-completion
      SUBSCRIPTION_RUNTIME_EXPECTED_LAUNCHER_SHA256: ${SUBSCRIPTION_RUNTIME_LAUNCHER_SHA256:?set launcher SHA-256}
      SUBSCRIPTION_RUNTIME_EXPECTED_PACKAGE_VERSION: 0.1.0-main.27
      SUBSCRIPTION_RUNTIME_GRPC_BIND: 0.0.0.0:50052
      SUBSCRIPTION_RUNTIME_ISOLATED_CWD: /run/discord-meeting-subscription-runtime/workspace
      SUBSCRIPTION_RUNTIME_LAUNCHER_PATH: /opt/subscription-runtime/audited-xhigh-launcher.mjs
      SUBSCRIPTION_RUNTIME_LOCAL_ENCRYPTION_KEY_FILE: /run/subscription-runtime-secrets/local-encryption-key
      SUBSCRIPTION_RUNTIME_PACKAGE_MANIFEST_PATH: /opt/subscription-runtime/node_modules/@vioxen/subscription-runtime/package.json
      SUBSCRIPTION_RUNTIME_PROTO_PATH: /app/apps/meeting-platform/proto/agent_runtime.proto
      SUBSCRIPTION_RUNTIME_PROVIDER: codex
      SUBSCRIPTION_RUNTIME_PROVIDER_INSTANCE_ID: discord-meeting-summary-v3
      SUBSCRIPTION_RUNTIME_PURPOSE_POLICY_FILE: /etc/subscription-runtime/sidecar-policy.json
      SUBSCRIPTION_RUNTIME_SERVICE_TOKEN_FILE: /run/subscription-runtime-secrets/service-token
      SUBSCRIPTION_RUNTIME_STATE_ROOT: /var/lib/subscription-runtime
      PATH: /app/apps/subscription-runtime-sidecar/node_modules/.bin:/opt/subscription-runtime/node_modules/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - ${DEPLOY_ROOT:?set DEPLOY_ROOT}/runtime/installation/node_modules:/opt/subscription-runtime/node_modules:ro
      - ${DEPLOY_ROOT:?set DEPLOY_ROOT}/runtime/auth-pool:/run/subscription-runtime-auth:ro
      - ${DEPLOY_ROOT:?set DEPLOY_ROOT}/runtime/state:/var/lib/subscription-runtime
      - ${DEPLOY_ROOT:?set DEPLOY_ROOT}/secrets/runtime:/run/subscription-runtime-secrets:ro
      - ../../infra/subscription-runtime/sidecar-policy.json:/etc/subscription-runtime/sidecar-policy.json:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=0700,uid=10001,gid=10001
      - /run/discord-meeting-subscription-runtime/workspace:rw,noexec,nosuid,nodev,size=32m,mode=0700,uid=10001,gid=10001
    cap_drop: [ALL]
    networks: [meeting-internal, meeting-egress]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    stop_grace_period: 30s

  pipecat-runtime:
    profiles: [conversation]
    build:
      args:
        SOURCE_REVISION: ${MEETING_PLATFORM_SOURCE_REVISION:?set immutable source revision}
      context: ../../apps/pipecat-runtime
      dockerfile: Dockerfile
    image: discord-meeting/pipecat-runtime:${MEETING_PLATFORM_SOURCE_REVISION:?set immutable source revision}
    init: true
    restart: unless-stopped
    read_only: true
    environment:
      PIPECAT_RUNTIME_BEARER_TOKEN_FILE: /run/platform-secrets/conversation-runtime-token
      PIPECAT_RUNTIME_BIND_HOST: 0.0.0.0
      PIPECAT_RUNTIME_BIND_PORT: "50053"
      PIPECAT_RUNTIME_ELEVENLABS_API_KEY_FILE: /run/pipecat-secrets/elevenlabs-api-key
      PIPECAT_RUNTIME_ELEVENLABS_MODEL: ${PIPECAT_RUNTIME_ELEVENLABS_MODEL:-eleven_flash_v2_5}
      PIPECAT_RUNTIME_ELEVENLABS_VOICE_ID: ${PIPECAT_RUNTIME_ELEVENLABS_VOICE_ID:-jqcCZkN6Knx8BJ5TBdYR}
      PIPECAT_RUNTIME_ENVIRONMENT: production
      PIPECAT_RUNTIME_OLLAMA_BASE_URL: ${PIPECAT_RUNTIME_OLLAMA_BASE_URL:-http://ollama:11434/v1}
      PIPECAT_RUNTIME_OLLAMA_MODEL: ${PIPECAT_RUNTIME_OLLAMA_MODEL:-qwen3:8b}
      PIPECAT_RUNTIME_PIPER_BASE_URL: ${PIPECAT_RUNTIME_PIPER_BASE_URL:-http://piper:5000}
      PIPECAT_RUNTIME_PIPER_VOICE_ID: ${PIPECAT_RUNTIME_PIPER_VOICE_ID:-ru_RU-irina-medium}
      PIPECAT_RUNTIME_PROFILE: ${PIPECAT_RUNTIME_PROFILE:-elevenlabs-multilingual}
      PIPECAT_RUNTIME_PROFILE_ID: ${CONVERSATION_VOICE_PROFILE_ID:-elevenlabs-multilingual}
      PIPECAT_RUNTIME_SUBSCRIPTION_RUNTIME_ADDRESS: subscription-runtime-sidecar:50052
      PIPECAT_RUNTIME_SUBSCRIPTION_RUNTIME_SERVICE_TOKEN_FILE: /run/platform-secrets/runtime-service-token
      PIPECAT_RUNTIME_SUBSCRIPTION_RUNTIME_TIMEOUT_MS: ${PIPECAT_RUNTIME_SUBSCRIPTION_RUNTIME_TIMEOUT_MS:-30000}
    volumes:
      - ${DEPLOY_ROOT:?set DEPLOY_ROOT}/secrets/platform/conversation-runtime-token:/run/platform-secrets/conversation-runtime-token:ro
      - ${DEPLOY_ROOT:?set DEPLOY_ROOT}/secrets/platform/runtime-service-token:/run/platform-secrets/runtime-service-token:ro
      - ${DEPLOY_ROOT:?set DEPLOY_ROOT}/secrets/pipecat:/run/pipecat-secrets:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=0700,uid=10001,gid=10001
    cap_drop: [ALL]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 50053), 2).close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [meeting-internal, meeting-egress]
    security_opt: [no-new-privileges:true]
    cpus: ${PIPECAT_RUNTIME_CPUS:-2.0}
    mem_limit: ${PIPECAT_RUNTIME_MEMORY_LIMIT:-2g}
    pids_limit: 256
    stop_grace_period: 30s

  meeting-platform:
    build:
      args:
        SOURCE_REVISION: ${MEETING_PLATFORM_SOURCE_REVISION:?set immutable source revision}
      context: ../..
      dockerfile: apps/meeting-platform/Dockerfile
    image: discord-meeting/meeting-platform:${MEETING_PLATFORM_SOURCE_REVISION:?set immutable source revision}
    deploy:
      replicas: 1
    init: true
    restart: unless-stopped
    read_only: true
    environment:
      BIND_ADDRESS: 0.0.0.0
      CONVERSATION_ENABLED: ${CONVERSATION_ENABLED:-false}
      CONVERSATION_FAREWELL_CUE_ROOT: /app/apps/meeting-platform/assets/farewell-cues
      CONVERSATION_RUNTIME_ADDRESS: pipecat-runtime:50053
      CONVERSATION_RUNTIME_TOKEN_FILE: /run/secrets/conversation-runtime-token
      CONVERSATION_SYSTEM_PROMPT: ${CONVERSATION_SYSTEM_PROMPT:-You are Botik, a concise voice assistant. Answer in the participant's language. When that language uses grammatical gender, refer to yourself using feminine forms. Never claim to remember earlier turns.}
      CONVERSATION_THINKING_CUE_ROOT: /app/apps/meeting-platform/assets/thinking-cues
      CONVERSATION_VOICE_ID: ${PIPECAT_RUNTIME_ELEVENLABS_VOICE_ID:-jqcCZkN6Knx8BJ5TBdYR}
      CONVERSATION_VOICE_PROFILE_ID: ${CONVERSATION_VOICE_PROFILE_ID:-elevenlabs-multilingual}
      CRAIG_BEARER_TOKEN_FILE: /run/secrets/craig-bearer-token
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-1533224474609057793}
      DISCORD_BOTIK_APPLICATION_ID: ${DISCORD_BOTIK_APPLICATION_ID:-1534231284467896512}
      DISCORD_CRAIG_APPLICATION_ID: ${DISCORD_CRAIG_APPLICATION_ID:-1533224474609057793}
      DISCORD_LEGACY_GUILD_ID: ${DISCORD_LEGACY_GUILD_ID:-}
      DISCORD_LEGACY_VOICE_CHANNEL_ID: ${DISCORD_LEGACY_VOICE_CHANNEL_ID:-}
      DISCORD_FINAL_PUBLICATION_MODE: ${DISCORD_FINAL_PUBLICATION_MODE:-separate-message}
      DISCORD_PUBLICATION_MODE: ${DISCORD_PUBLICATION_MODE:-message}
      DISCORD_RESULTS_CHANNEL_ID: ${DISCORD_RESULTS_CHANNEL_ID:-}
      DISCORD_TOKEN_FILE: /run/secrets/discord-sut-token
      LIVE_INGRESS_OWNER_MODE: singleton
      NODE_ENV: production
      PARTICIPANT_GREETING_DEFAULT_LOCALE: ${PARTICIPANT_GREETING_DEFAULT_LOCALE:-ru}
      PARTICIPANT_GREETING_PROFILES_JSON: ${PARTICIPANT_GREETING_PROFILES_JSON:-}
      PORT: "4310"
      POSTGRES_URL_FILE: /run/secrets/postgres-url
      RECORDING_SPOOL_ROOT: /var/lib/discord-meeting/spool
      RECORDING_PLAYBACK_PUBLIC_BASE_URL: ${RECORDING_PLAYBACK_PUBLIC_BASE_URL:-}
      RECORDING_PLAYBACK_SIGNING_SECRET_FILE: ${RECORDING_PLAYBACK_SIGNING_SECRET_FILE:-}
      REDIS_URL_FILE: /run/secrets/redis-url
      S3_ACCESS_KEY_ID_FILE: /run/secrets/s3-access-key-id
      S3_BUCKET: meeting-artifacts
      S3_ENDPOINT: http://object-storage:8333
      S3_PREFIX: recordings/
      S3_REGION: us-east-1
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3-secret-access-key
      SPEACHES_BASE_URL: http://speaches:8000
      SPEACHES_MODEL: ${SPEACHES_MODEL_ID:-Systran/faster-whisper-small}
      SUBSCRIPTION_RUNTIME_ADDRESS: subscription-runtime-sidecar:50052
      SUBSCRIPTION_RUNTIME_LAUNCHER_SHA256: ${SUBSCRIPTION_RUNTIME_LAUNCHER_SHA256:?set launcher SHA-256}
      SUBSCRIPTION_RUNTIME_TOKEN_FILE: /run/secrets/runtime-service-token
      TRANSCRIPTION_PROVIDER: voicetext
      VOICETEXT_BATCH_MAX_ARTIFACT_BYTES: ${VOICETEXT_BATCH_MAX_ARTIFACT_BYTES:-67108864}
      VOICETEXT_BATCH_MAX_CONCURRENCY: ${VOICETEXT_BATCH_MAX_CONCURRENCY:-6}
      VOICETEXT_BATCH_MAX_CONCURRENT_MEETINGS: ${VOICETEXT_BATCH_MAX_CONCURRENT_MEETINGS:-1}
      VOICETEXT_LIVE_MAX_CONCURRENT_SESSIONS: ${VOICETEXT_LIVE_MAX_CONCURRENT_SESSIONS:-10}
      VOICETEXT_LIVE_PACKET_BACKPRESSURE_TIMEOUT_MS: ${VOICETEXT_LIVE_PACKET_BACKPRESSURE_TIMEOUT_MS:-2000}
      VOICETEXT_SERVICE_TOKEN_FILE: /run/secrets/voicetext-service-token
      VOICETEXT_WS_URL: ${VOICETEXT_WS_URL:-wss://api.voicetext.site/api/v1/transcribe/stream}
    volumes:
      - ${DEPLOY_ROOT:?set DEPLOY_ROOT}/data/spool:/var/lib/discord-meeting/spool
      - ${DEPLOY_ROOT:?set DEPLOY_ROOT}/secrets/platform:/run/secrets:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=0700,uid=10001,gid=10001
    cap_drop: [ALL]
    depends_on:
      postgres: { condition: service_healthy }
      postgres-migrations: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      object-storage: { condition: service_started }
      subscription-runtime-sidecar: { condition: service_started }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4310/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 7s
      retries: 30
      start_period: 30s
    networks: [meeting-internal, meeting-egress]
    security_opt: [no-new-privileges:true]
    cpus: ${MEETING_PLATFORM_CPUS:-2.0}
    mem_limit: ${MEETING_PLATFORM_MEMORY_LIMIT:-2g}
    stop_grace_period: 45s

networks:
  meeting-internal:
    name: discord-meeting-internal
    internal: true
  meeting-egress:
    name: discord-meeting-egress
