name: discord-meeting-subscription-runtime

services:
  subscription-runtime-sidecar:
    image: ${SUBSCRIPTION_RUNTIME_IMAGE:?pin an immutable subscription runtime sidecar image}
    user: "${SUBSCRIPTION_RUNTIME_UID:-10001}:${SUBSCRIPTION_RUNTIME_GID:-10001}"
    read_only: true
    environment:
      SUBSCRIPTION_RUNTIME_AUTH_JSON_PATH: /run/subscription-runtime-auth/auth.json
      SUBSCRIPTION_RUNTIME_DISABLE_TOOLS: "1"
      SUBSCRIPTION_RUNTIME_EXECUTION_PROFILE: stateless-completion
      SUBSCRIPTION_RUNTIME_EXPECTED_LAUNCHER_SHA256: ${SUBSCRIPTION_RUNTIME_EXPECTED_LAUNCHER_SHA256:?set the admitted launcher SHA-256}
      SUBSCRIPTION_RUNTIME_EXPECTED_PACKAGE_VERSION: 0.1.0-main.2
      SUBSCRIPTION_RUNTIME_GRPC_BIND: 0.0.0.0:50052
      SUBSCRIPTION_RUNTIME_ISOLATED_CWD: /run/discord-meeting-subscription-runtime/workspace
      SUBSCRIPTION_RUNTIME_LOCAL_ENCRYPTION_KEY_FILE: /run/subscription-runtime-secrets/local-encryption-key
      SUBSCRIPTION_RUNTIME_MODEL: gpt-5.6-sol
      SUBSCRIPTION_RUNTIME_PROVIDER: codex
      SUBSCRIPTION_RUNTIME_PROVIDER_INSTANCE_ID: discord-meeting-summary-v1
      SUBSCRIPTION_RUNTIME_PURPOSE_POLICY_FILE: /etc/subscription-runtime/sidecar-policy.json
      SUBSCRIPTION_RUNTIME_REASONING_EFFORT: xhigh
      SUBSCRIPTION_RUNTIME_SERVICE_TOKEN_FILE: /run/subscription-runtime-secrets/service-token
      SUBSCRIPTION_RUNTIME_STATE_ROOT: /var/lib/subscription-runtime
    expose:
      - "50052"
    volumes:
      - ${SUBSCRIPTION_RUNTIME_PRIVATE_ROOT:?set a Meeting Assistant private root}/auth-current:/run/subscription-runtime-auth:ro
      - ${SUBSCRIPTION_RUNTIME_PRIVATE_ROOT:?set a Meeting Assistant private root}/state:/var/lib/subscription-runtime
      - ${SUBSCRIPTION_RUNTIME_PRIVATE_ROOT:?set a Meeting Assistant private root}/secrets:/run/subscription-runtime-secrets:ro
      - ./sidecar-policy.json:/etc/subscription-runtime/sidecar-policy.json:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=0700,uid=${SUBSCRIPTION_RUNTIME_UID:-10001},gid=${SUBSCRIPTION_RUNTIME_GID:-10001}
      - /run/discord-meeting-subscription-runtime/workspace:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=${SUBSCRIPTION_RUNTIME_UID:-10001},gid=${SUBSCRIPTION_RUNTIME_GID:-10001}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - meeting-internal

networks:
  meeting-internal:
    name: discord-meeting-internal
    internal: true
