name: discord-meeting-object-storage-integration

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.29@sha256:d47c7ee99fcb951351d7194915f4e3a5ea604a8e8871183d713907dec4fb9bf5
    environment:
      AWS_ACCESS_KEY_ID: meeting-e2e-access
      AWS_SECRET_ACCESS_KEY: meeting-e2e-secret
      S3_BUCKET: meeting-e2e-artifacts
    ports:
      - "127.0.0.1:18333:8333"
    restart: "no"
    tmpfs:
      - /data:size=256m,mode=0700
