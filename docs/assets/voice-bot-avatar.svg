<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Voice Bot avatar</title>
  <desc id="description">A smiling robot wearing blue headphones.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#273b8f"/>
      <stop offset="0.62" stop-color="#111b4c"/>
      <stop offset="1" stop-color="#080d29"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0.85" y2="1">
