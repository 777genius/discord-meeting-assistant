schemaVersion: 1
workspace:
  kind: pnpm
  manifest: pnpm-workspace.yaml
governedRoots:
  - apps/discord-e2e-actors/src
  - apps/meeting-platform/src
  - apps/subscription-runtime-sidecar/src
  - packages/ai-adapters/src
  - packages/bullmq-adapter/src
  - packages/craig-gateway-contracts/src
  - packages/discord-adapter/src
  - packages/meeting-core/src
  - packages/object-storage-adapter/src
  - packages/observability-adapter/src
  - packages/postgres-adapter/src
  - packages/recording-ingress-adapter/src
  - packages/speaches-adapter/src
  - packages/subscription-runtime-adapter/src
  - tooling/architecture-baseline/src
boundaries:
  - id: core.meeting
    roots:
      - packages/meeting-core/src
    allow:
      boundaries: []
      packages: []
      builtins: []
      runtimeReferences: []
  - id: contracts.craig-gateway
    roots:
      - packages/craig-gateway-contracts/src
    allow:
      boundaries: []
      packages:
        - zod
      builtins: []
      runtimeReferences: []
  - id: adapters.ai
    roots:
      - packages/ai-adapters/src
    allow:
      boundaries:
        - core.meeting
      packages:
        - "@discord-meeting/meeting-core"
        - openai
        - zod
      builtins: []
      runtimeReferences: []
  - id: adapters.bullmq
    roots:
      - packages/bullmq-adapter/src
    allow:
      boundaries: []
      packages:
        - bullmq
        - zod
      builtins:
        - node:crypto
      runtimeReferences: []
  - id: adapters.discord
    roots:
      - packages/discord-adapter/src
    allow:
      boundaries:
        - core.meeting
      packages:
        - "@discord-meeting/meeting-core"
        - discord.js
        - zod
      builtins:
        - node:crypto
      runtimeReferences: []
  - id: adapters.postgres
    roots:
      - packages/postgres-adapter/src
    allow:
      boundaries:
        - core.meeting
      packages:
        - "@discord-meeting/meeting-core"
        - pg
      builtins: []
      runtimeReferences: []
  - id: adapters.recording-ingress
    roots:
      - packages/recording-ingress-adapter/src
    allow:
      boundaries:
        - contracts.craig-gateway
        - core.meeting
      packages:
