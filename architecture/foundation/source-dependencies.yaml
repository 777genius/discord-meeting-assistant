        - "@discord-meeting/meeting-core"
      builtins:
        - node:crypto
        - node:fs
        - node:fs/promises
        - node:path
      runtimeReferences: []
  - id: adapters.object-storage
    roots:
      - packages/object-storage-adapter/src
    allow:
      boundaries: []
      packages:
        - "@aws-sdk/client-s3"
        - "@aws-sdk/lib-storage"
      builtins:
        - node:crypto
        - node:stream
      runtimeReferences: []
