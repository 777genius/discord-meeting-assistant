schemaVersion: 1
instructions:
  canonical: AGENTS.md
  claude: CLAUDE.md
  gemini: GEMINI.md
  copilot: .github/copilot-instructions.md
scripts:
  changed: check:changed
  fast: check:fast
  full: check
changedChecks:
  - id: lint
    script: lint:fast:files
    extensions: [.js, .mjs, .cjs, .ts, .tsx]
  - id: typecheck
    script: typecheck
    extensions: [.ts, .tsx]
    passPaths: false
  - id: source-dependencies
    script: architecture:source
    extensions: [.js, .mjs, .cjs, .ts, .tsx]
    passPaths: false
fullScanPaths:
  - .github/workflows
  - architecture
  - infra
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - tsconfig.json
  - sgconfig.yml
  - knip.json
  - .oxlintrc.json
  - .oxlintrc.type-aware.json
