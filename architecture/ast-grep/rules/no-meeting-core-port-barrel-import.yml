id: meeting-core-no-internal-port-barrel-import
language: TypeScript
severity: error
message: Meeting Core application code must depend on its feature-owned port module.
note: Import the port from the current feature instead of a feature-level ports barrel.
files:
  - "packages/meeting-core/src/features/*/application/**/*.ts"
rule:
  all:
    - any:
        - kind: import_statement
        - kind: export_statement
    - regex: 'from\s+["''](?:\.\.?/)*ports\.js["'']'
