syntax = "proto3";

package social_monitor.agent_runtime.v1;

service AgentRuntimeService {
  rpc RunAgentTask(AgentRuntimeTaskRequest) returns (AgentRuntimeTaskResponse);
  rpc StreamAgentTask(AgentRuntimeTaskStreamRequest) returns (stream AgentRuntimeTaskEvent);
  rpc CheckHealth(AgentRuntimeHealthRequest) returns (AgentRuntimeHealthResponse);
}

enum AgentRuntimeProvider {
  AGENT_RUNTIME_PROVIDER_UNSPECIFIED = 0;
  AGENT_RUNTIME_PROVIDER_CODEX = 1;
  AGENT_RUNTIME_PROVIDER_CLAUDE = 2;
}

enum AgentRuntimeTaskStatus {
  AGENT_RUNTIME_TASK_STATUS_UNSPECIFIED = 0;
  AGENT_RUNTIME_TASK_STATUS_COMPLETED = 1;
  AGENT_RUNTIME_TASK_STATUS_FAILED = 2;
  AGENT_RUNTIME_TASK_STATUS_WAITING_FOR_INPUT = 3;
}

enum AgentRuntimeSelectedOutputKind {
  AGENT_RUNTIME_SELECTED_OUTPUT_KIND_UNSPECIFIED = 0;
  AGENT_RUNTIME_SELECTED_OUTPUT_KIND_STRUCTURED_OUTPUT = 1;
  AGENT_RUNTIME_SELECTED_OUTPUT_KIND_OUTPUT_TEXT = 2;
}

enum AgentRuntimeHealthStatus {
  AGENT_RUNTIME_HEALTH_STATUS_UNSPECIFIED = 0;
  AGENT_RUNTIME_HEALTH_STATUS_SERVING = 1;
  AGENT_RUNTIME_HEALTH_STATUS_DEGRADED = 2;
  AGENT_RUNTIME_HEALTH_STATUS_NOT_SERVING = 3;
}

enum AgentRuntimeTokenAvailability {
  AGENT_RUNTIME_TOKEN_AVAILABILITY_UNSPECIFIED = 0;
  AGENT_RUNTIME_TOKEN_AVAILABILITY_MEASURED = 1;
  AGENT_RUNTIME_TOKEN_AVAILABILITY_DERIVED = 2;
  AGENT_RUNTIME_TOKEN_AVAILABILITY_UNAVAILABLE = 3;
}

enum AgentRuntimeDerivedTokenSource {
  AGENT_RUNTIME_DERIVED_TOKEN_SOURCE_UNSPECIFIED = 0;
  AGENT_RUNTIME_DERIVED_TOKEN_SOURCE_INPUT = 1;
  AGENT_RUNTIME_DERIVED_TOKEN_SOURCE_OUTPUT = 2;
}

message AgentRuntimeTaskRequest {
  uint32 schema_version = 1;
  string request_id = 2;
  string tenant_id = 3;
  string workspace_id = 4;
  string correlation_id = 5;
  AgentRuntimeProvider provider = 6;
  string provider_instance_id = 7;
  string purpose = 8;
  string system_prompt = 9;
  string prompt = 10;
  string output_schema_json = 11;
  string controls_json = 12;
  uint32 timeout_ms = 13;
  string cwd = 14;
  map<string, string> metadata = 15;
}

message AgentRuntimeTaskStreamRequest { AgentRuntimeTaskRequest task = 1; }

message AgentRuntimeTaskResponse {
  uint32 schema_version = 1;
  AgentRuntimeTaskStatus status = 2;
  string output_text = 3;
  string structured_output_json = 4;
  repeated AgentRuntimeWarning warnings = 5;
  AgentRuntimeUsage usage = 6;
  AgentRuntimeFailure failure = 7;
  AgentRuntimeExecutionAttestation execution_attestation = 8;
  AgentRuntimeTelemetry telemetry = 9;
}

message AgentRuntimeTaskEvent {
  uint32 schema_version = 1;
  uint64 sequence = 2;
  oneof event {
    AgentRuntimeTaskStarted started = 3;
    AgentRuntimeTextDelta text_delta = 4;
    AgentRuntimeTaskResponse completed = 5;
  }
}

message AgentRuntimeTaskStarted {}

message AgentRuntimeTextDelta { string text = 1; }

message AgentRuntimeExecutionAttestation {
  uint32 schema_version = 1;
  string request_id = 2;
  string purpose = 3;
  string canonical_request_sha256 = 4;
  AgentRuntimeProvider provider = 5;
  string model = 6;
  string reasoning_effort = 7;
  string runtime_engine = 8;
  string runtime_package_version = 9;
  string launcher_sha256 = 10;
  AgentRuntimeSelectedOutputKind selected_output_kind = 11;
  string selected_output_sha256 = 12;
}

message AgentRuntimeUsage {
  // Token values are carried only when complete is true. Zero is a valid measured
  // value and must not be used to stand in for an omitted token class.
  uint32 input_tokens = 1;
  uint32 output_tokens = 2;
  uint32 total_tokens = 3;
  // Deprecated: proto3 uses zero for an absent scalar, so this cannot represent
  // a trustworthy cost. Meeting Platform derives a versioned API-equivalent cost
  // only from complete measured token classes.
  double estimated_cost_usd = 4 [deprecated = true];
  uint32 cached_input_tokens = 5;
  uint32 cache_write_input_tokens = 6;
  uint32 reasoning_output_tokens = 7;
  // True only when every token class in this message was measured by the runtime.
  bool complete = 8;
}

message AgentRuntimeTokenClass {
  // `value` is meaningful only for measured or derived availability. A zero
  // remains a valid measured value and cannot represent unavailability.
  AgentRuntimeTokenAvailability availability = 1;
  uint64 value = 2;
  repeated AgentRuntimeDerivedTokenSource derived_from = 3;
}

message AgentRuntimeCostRange {
  double minimum_usd = 1;
  double maximum_usd = 2;
  // Guards the scalar below so an unavailable exact cost is never read as 0.
  bool has_exact_usd = 3;
  double exact_usd = 4;
  string price_card_id = 5;
  string price_card_source = 6;
}

message AgentRuntimeTelemetry {
  string source = 1;
  AgentRuntimeTokenClass input_tokens = 2;
  AgentRuntimeTokenClass cached_input_tokens = 3;
  AgentRuntimeTokenClass cache_write_input_tokens = 4;
  AgentRuntimeTokenClass output_tokens = 5;
  AgentRuntimeTokenClass reasoning_output_tokens = 6;
  AgentRuntimeTokenClass total_tokens = 7;
  AgentRuntimeCostRange cost = 8;
}

message AgentRuntimeFailure {
  string code = 1;
  string safe_message = 2;
  bool retryable = 3;
  bool reconnect_required = 4;
  string cause_category = 5;
  map<string, string> details = 6;
}

message AgentRuntimeWarning {
  string code = 1;
  string message = 2;
}

message AgentRuntimeHealthRequest { string service = 1; }

message AgentRuntimeHealthResponse {
  AgentRuntimeHealthStatus status = 1;
  string runtime_engine = 2;
  string runtime_version = 3;
  repeated AgentRuntimeWarning warnings = 4;
  string launcher_sha256 = 5;
}
