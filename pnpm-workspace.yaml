packages:
  - "apps/*"
  - "packages/**"
  - "tooling/*"

catalogMode: strict

catalog:
  "@grpc/grpc-js": 1.14.4
  "@grpc/proto-loader": 0.8.1
  "@aws-sdk/client-s3": 3.1101.0
  "@aws-sdk/lib-storage": 3.1101.0
  "@ast-grep/cli": 0.45.0
  "@discordjs/voice": 0.19.2
  "@types/node": 24.13.3
  "@types/pg": 8.20.1
  bullmq: 5.81.3
  discord.js: 14.27.0
  knip: 6.31.0
  nx: 23.1.1
  openai: 7.3.0
  oxlint: 1.76.0
  oxlint-tsgolint: 7.0.2001
  pg: 8.22.0
  pino: 10.3.1
  testcontainers: 12.0.4
  tsx: 4.23.1
  typescript: 7.0.2
  vitest: 4.1.10
  zod: 4.4.3

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

minimumReleaseAgeExclude:
  - "@agent-teams/engineering-foundation@0.3.0"

allowBuilds:
  "@ast-grep/cli": true
  cpu-features: set this to true or false
  esbuild: true
  msgpackr-extract: false
  nx: true
  protobufjs: set this to true or false
  ssh2: set this to true or false
